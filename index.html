<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin & User Management Dashboard</title>
    <!-- Firebase App & Database SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        .lang-btns button { background: #3b82f6; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; }
        .lang-btns button:hover { background: #2563eb; }
        
        .market-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
        .market-box h3 { margin-top: 0; color: #38bdf8; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: left; }
        th { background: #334155; }
        
        .status-box { padding: 10px; margin-bottom: 15px; border-radius: 6px; font-weight: bold; }
        .connected { background: #065f46; color: #a7f3d0; }
        .disconnected { background: #991b1b; color: #fecaca; }
    </style>
</head>
<body>

<div class="container">
    <!-- Header with Language Switcher -->
    <header>
        <h2 id="ui-title">Admin Dashboard & စျေးကွက်</h2>
        <div class="lang-btns">
            <button onclick="setLanguage('my')">မြန်မာ</button>
            <button onclick="setLanguage('en')">English</button>
        </div>
    </header>

    <!-- Connection Status -->
    <div id="connection-status" class="status-box disconnected">ဆာဗာသို့ ချိတ်ဆက်နေပါသည်...</div>

    <!-- Live Market Price Ticker -->
    <div class="market-box">
        <h3 id="ui-market-title">📈 ဒီဂျစ်တယ် စျေးကွက် တန်ဖိုး အတက်အကျ</h3>
        <p>Bitcoin (BTC/USDT): <span id="btc-price" style="color: #4ade80; font-weight: bold;">--</span></p>
        <p>Ethereum (ETH/USDT): <span id="eth-price" style="color: #4ade80; font-weight: bold;">--</span></p>
    </div>

    <!-- Admin User List Section -->
    <div>
        <h3 id="ui-userlist-title">👥 အသုံးပြုသူ (User) စာရင်းများ</h3>
        <table>
            <thead>
                <tr>
                    <th id="th-name">အမည်</th>
                    <th id="th-email">အီးမေးလ်</th>
                    <th id="th-coins">ဒင်္ဂါးပြား (Coins)</th>
                    <th id="th-date">ဝင်ရောက်သည့်ရက်စွဲ</th>
                </tr>
            </thead>
            <tbody id="admin-users-table">
                <tr><td colspan="4" style="text-align: center;">ဒေတာများကို ရယူနေပါသည်...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- ၁။ Firebase Configuration (သင့်အချက်အလက်များ တိုက်ရိုက်ထည့်သွင်းပြီးပါပြီ) ---
    const firebaseConfig = {
      apiKey: "AIzaSyAJEPzTtp5gimIq8lSWjmGDzNEoywofmsc",
      authDomain: "moneycaush.firebaseapp.com",
      databaseURL: "https://moneycaush-default-rtdb.firebaseio.com",
      projectId: "moneycaush",
      storageBucket: "moneycaush.firebasestorage.app",
      messagingSenderId: "361933914338",
      appId: "1:361933914338:web:66e6ef5a14d74dd2209ebb",
      measurementId: "G-PTCJRLF5GG"
    };

    // Firebase Initialization
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // --- ၂။ Language Dictionary ---
    const langData = {
        my: {
            title: "Admin Dashboard & စျေးကွက်",
            marketTitle: "📈 ဒီဂျစ်တယ် စျေးကွက် တန်ဖိုး အတက်အကျ",
            userListTitle: "👥 အသုံးပြုသူ (User) စာရင်းများ",
            thName: "အမည်",
            thEmail: "အီးမေးလ်",
            thCoins: "ဒင်္ဂါးပြား (Coins)",
            thDate: "ဝင်ရောက်သည့်ရက်စွဲ",
            connConnected: "ဆာဗာသို့ အောင်မြင်စွာ ချိတ်ဆက်ပြီးပါပြီ",
            connDisconnected: "ဆာဗာနှင့် ချိတ်ဆက်မှု ပြတ်တောက်နေသည်"
        },
        en: {
            title: "Admin Dashboard & Market",
            marketTitle: "📈 Digital Market Price Fluctuations",
            userListTitle: "👥 User List",
            thName: "Name",
            thEmail: "Email",
            thCoins: "Coins",
            thDate: "Joined Date",
            connConnected: "Successfully connected to server",
            connDisconnected: "Disconnected from server"
        }
    };

    let currentLang = localStorage.getItem('app_lang') || 'my';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('app_lang', lang);
        updateUI();
    }

    function updateUI() {
        const t = langData[currentLang];
        document.getElementById('ui-title').innerText = t.title;
        document.getElementById('ui-market-title').innerText = t.marketTitle;
        document.getElementById('ui-userlist-title').innerText = t.userListTitle;
        document.getElementById('th-name').innerText = t.thName;
        document.getElementById('th-email').innerText = t.thEmail;
        document.getElementById('th-coins').innerText = t.thCoins;
        document.getElementById('th-date').innerText = t.thDate;
    }

    // --- ၃။ Server Connection & Admin User List Sync ---
    const statusBox = document.getElementById('connection-status');
    
    db.ref('.info/connected').on('value', (snap) => {
        const t = langData[currentLang];
        if (snap.val() === true) {
            statusBox.className = "status-box connected";
            statusBox.innerText = t.connConnected;
            loadAdminUsers(); // ချိတ်ဆက်မိတာနဲ့ User စာရင်းဆွဲမည်
        } else {
            statusBox.className = "status-box disconnected";
            statusBox.innerText = t.connDisconnected;
        }
    });

    // User စာရင်းများကို Admin Panel သို့ Realtime ဆွဲထုတ်ပြသခြင်း
    function loadAdminUsers() {
        const usersRef = db.ref('users');
        usersRef.on('value', (snapshot) => {
            const tableBody = document.getElementById('admin-users-table');
            tableBody.innerHTML = '';
            const data = snapshot.val();

            if (data) {
                Object.keys(data).forEach((key) => {
                    const user = data[key];
                    const row = `<tr>
                        <td>${user.name || 'N/A'}</td>
                        <td>${user.email || 'N/A'}</td>
                        <td>${user.coins || 0}</td>
                        <td>${user.joinedAt ? new Date(user.joinedAt).toLocaleDateString() : 'N/A'}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } else {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center;">User စာရင်း မရှိသေးပါ</td></tr>`;
            }
        });
    }

    // --- ၄။ Live Market Price Ticker Simulation (အချိန်နှင့်တပြေးညီ အတက်အကျ) ---
    function updateMarketPrices() {
        let btc = (64000 + (Math.random() * 300 - 150)).toFixed(2);
        let eth = (3400 + (Math.random() * 50 - 25)).toFixed(2);
        
        document.getElementById('btc-price').innerText = `$${btc} (Live)`;
        document.getElementById('eth-price').innerText = `$${eth} (Live)`;
    }

    setInterval(updateMarketPrices, 3000); // ၃ စက္ကန့်တစ်ကြိမ် ပြောင်းလဲမည်
    updateMarketPrices();

    // Init Page Language
    updateUI();
</script>

</body>
</html>
